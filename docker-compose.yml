# Pinned explicitly so the project name (and therefore volume names, e.g. "<name>_oauth-data")
# stays stable regardless of which directory this file lives in — Compose otherwise derives it
# from the containing folder's name, which would silently create a fresh, empty volume (losing
# the registered passkey and OAuth clients) if this ever gets moved, e.g. into Dockge's managed
# stack directory. Matches the name already in use, so this is a no-op for the current deployment.
name: obsidian-mcp-remote-test

services:
  # SEC-011 fix: this container gets its own Tailscale identity instead of sharing npm_shared with
  # every other service (Gitea, AFFiNE, n8n, Homarr, Filebrowser, Dockge). It's the one container
  # on that network reachable from the public internet, so it was previously one compromise away
  # from Docker-DNS access to all of them, regardless of the Tailscale-only NPM Access Lists (those
  # only govern traffic actually routed through NPM, not container-to-container). NPM reaches this
  # container over the tailnet now (routing confirmed working 2026-08-06), the same way it already
  # reaches every other host-IP-proxied service - see [[vps]] for the NPM-side Forward Host change.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: obsidian-mcp-remote-tailscale
    hostname: obsidian-mcp-remote
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "tailscale ip -4"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  obsidian-mcp-remote:
    build: .
    container_name: obsidian-mcp-remote
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      - VAULT_PATH=/vault
      - TOKEN_INTERNAL=${TOKEN_INTERNAL}
      - DOMAIN=${DOMAIN}
      - PORT=3000
      - OAUTH_PASSWORD=${OAUTH_PASSWORD}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_CLIENT_REDIRECT_URI=${OAUTH_CLIENT_REDIRECT_URI}
      - OAUTH_STORE_PATH=/data/oauth-store.json
      - WEBAUTHN_STORE_PATH=/data/webauthn-credential.json
      - NTFY_TOPIC=${NTFY_TOPIC}
    volumes:
      - ${VAULT_PATH}:/vault
      - oauth-data:/data
    read_only: true
    tmpfs:
      - /tmp

volumes:
  oauth-data:
  ts-state:
