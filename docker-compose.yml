# Pinned explicitly so the project name (and therefore volume names, e.g. "<name>_oauth-data")
# stays stable regardless of which directory this file lives in — Compose otherwise derives it
# from the containing folder's name, which would silently create a fresh, empty volume (losing
# the registered passkey and OAuth clients) if this ever gets moved, e.g. into Dockge's managed
# stack directory. Matches the name already in use, so this is a no-op for the current deployment.
name: obsidian-mcp-remote-test

services:
  obsidian-mcp-remote:
    build: .
    container_name: obsidian-mcp-remote
    restart: unless-stopped
    environment:
      - VAULT_PATH=/vault
      - TOKEN_INTERNAL=${TOKEN_INTERNAL}
      - DOMAIN=${DOMAIN}
      - PORT=3000
      - OAUTH_PASSWORD=${OAUTH_PASSWORD}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_CLIENT_REDIRECT_URI=${OAUTH_CLIENT_REDIRECT_URI}
      - OAUTH_STORE_PATH=/data/oauth-store.json
      - WEBAUTHN_STORE_PATH=/data/webauthn-credential.json
      - NTFY_TOPIC=${NTFY_TOPIC}
    ports:
      - "${TAILSCALE_IP}:${HOST_PORT}:3000"
    volumes:
      - ${VAULT_PATH}:/vault
      - oauth-data:/data
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - mcp_net

# Deliberately NOT npm_shared: that network also holds Gitea, AFFiNE, n8n, Homarr, Filebrowser,
# Dockge, etc. This is the one container in that whole stack reachable from the public internet -
# membership in npm_shared would let it reach every other internal service directly over Docker's
# own DNS, completely bypassing the Tailscale-only NPM Access Lists protecting them (those only
# apply to traffic actually routed through NPM, not container-to-container traffic on a shared
# network). mcp_net is scoped to exactly what this container needs to reach (Gitea) and be reached
# by (NPM, for the public obsidian-mcp.* domain) - see [[obsidian-mcp-remote]] SEC-011.
networks:
  mcp_net:
    external: true

volumes:
  oauth-data:
